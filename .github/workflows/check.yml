# Build sbcl-rasp from a clean checkout and run the tests, on Linux and macOS.
# The machines get only what a user needs: SBCL, a C compiler and make.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-build-deps
        with:
          mingw: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Build
        run: make
      - name: Test
        run: make check
      - name: Build Windows cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: cd browsered && make windows
